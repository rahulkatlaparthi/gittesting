name: Verify Required Files

on:
  pull_request:
    branches:
      - uat

jobs:
  fetch-required-files:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout `project` branch (for required_files.txt)
      uses: actions/checkout@v3
      with:
        ref: project
        
    - name: Copy required_files.txt for validation
      run: cp required_files.txt /tmp/required_files.txt
    
    - name: Upload required_files.txt for use in next job
      uses: actions/upload-artifact@v3
      with:
        name: required-files
        path: /tmp/required_files.txt

  check-files-in-dev:
    needs: fetch-required-files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout `dev` branch (for actual file checks)
        uses: actions/checkout@v3
        with:
          ref: dev

      - name: Download required_files.txt
        uses: actions/download-artifact@v3
        with:
          name: required-files
          path: /tmp

      - name: Debug
        run: ls -l /tmp

      - name: Verify required files
        run: |
          if [ ! -f "/tmp/required_files.txt" ]; then
            echo "required_files.txt not found!"
            exit 1
          fi

          while IFS= read -r file; do
            if [ ! -f "$file" ]; then
              echo "$file is missing in dev!"
              exit 1
            fi
          done < /tmp/required_files.txt

      - name: Approval to proceed
        run: echo "✅ All required files exist in dev. Ready for PR!"
